# Production stack for VPS. Bind API/frontend to localhost; host nginx terminates TLS.
name: contentforge

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: contentforge
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: contentforge
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U contentforge -d contentforge"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ./backend
    restart: unless-stopped
    command: >
      sh -c "alembic upgrade head &&
      uvicorn app.main:app --host 0.0.0.0 --port 8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://contentforge:${POSTGRES_PASSWORD}@postgres:5432/contentforge
      REDIS_URL: redis://redis:6379/0
      MEDIA_ROOT: /app/data/media
      TELEGRAM_HTTPS_PROXY: ""
    volumes:
      - media_data:/app/data/media
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')",
        ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  worker:
    build:
      context: ./backend
    restart: unless-stopped
    command: celery -A app.celery_app:celery_app worker -Q celery,ai --loglevel=info
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://contentforge:${POSTGRES_PASSWORD}@postgres:5432/contentforge
      REDIS_URL: redis://redis:6379/0
      MEDIA_ROOT: /app/data/media
      TELEGRAM_HTTPS_PROXY: ""
    volumes:
      - media_data:/app/data/media
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  beat:
    build:
      context: ./backend
    restart: unless-stopped
    command: celery -A app.celery_app:celery_app beat --loglevel=info
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://contentforge:${POSTGRES_PASSWORD}@postgres:5432/contentforge
      REDIS_URL: redis://redis:6379/0
      MEDIA_ROOT: /app/data/media
      TELEGRAM_HTTPS_PROXY: ""
    volumes:
      - media_data:/app/data/media
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:80"

volumes:
  postgres_data:
  media_data:
